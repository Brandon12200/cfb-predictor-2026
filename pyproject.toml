[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfb-contrarian-predictor"
version = "2026.0.0"
description = "Rule-based, frozen-weight college football contrarian spread model (2026 season)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Runtime deps are intentionally minimal — the workload is I/O + stdlib arithmetic.
dependencies = [
    "requests>=2.31,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=4.1",
    "pytest-mock>=3.11",
    "pytest-timeout>=2.4",
    "ruff>=0.15",
    "mypy>=1.15",
    "types-requests>=2.31",
]

[tool.setuptools]
py-modules = ["main", "config"]

[tool.setuptools.packages.find]
include = ["cli*", "engine*", "factors*", "data*", "utils*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # long argparse help / descriptive strings

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
addopts = "-p no:cacheprovider"
