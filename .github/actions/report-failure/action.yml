name: report-failure
description: >
  Open (or update) a deduplicated GitHub Issue for a failed pipeline run, with logs attached.
  A composite invoked as an `if: failure()` step in the SAME job — a reusable workflow runs as a
  separate job and cannot see the failing job's log file or step outcomes.

inputs:
  stage:
    description: predict | capture | grade | ci | freeze
    required: true
  week:
    required: false
    default: ""
  mode:
    description: live | rehearsal
    required: false
    default: live
  kind:
    description: >
      Event class. Becomes the `pipeline-<kind>` label and separates dedupe buckets, so an
      "SP+ arrived" notification can never be swallowed by an open "the job failed" issue.
    required: false
    default: failure
  title:
    description: Override the generated title
    required: false
    default: ""
  body:
    description: Extra context prepended to the log tail
    required: false
    default: ""
  cooldown-minutes:
    description: Minimum gap between comments on an already-open issue
    required: false
    default: "360"
  token:
    required: true

runs:
  using: composite
  steps:
    - name: Upload logs
      uses: actions/upload-artifact@v4
      with:
        name: pipeline-${{ inputs.stage }}-${{ github.run_id }}
        path: ${{ runner.temp }}/pipeline.log
        if-no-files-found: ignore
        retention-days: 30

    - name: Capture the working-tree state
      shell: bash
      run: |
        # What was half-written when it died — the single most useful thing when a run dies
        # between producing an artifact and committing it.
        {
          echo "### git status"; git status --porcelain || true
          echo; echo "### staged diff (names)"; git diff --cached --name-only || true
          echo; echo "### unstaged diff (names)"; git diff --name-only || true
          # Committed-but-unpushed work. In a push failure the tree is CLEAN and the three checks
          # above show nothing — this is the only line that reveals the artifact that was produced,
          # committed, and then stranded locally.
          echo; echo "### committed but not pushed"
          git log --oneline "origin/${GITHUB_REF_NAME}..HEAD" 2>/dev/null || echo "(no upstream ref)"
        } >> "${RUNNER_TEMP}/pipeline.log"

    - name: Open or update the issue
      shell: bash
      # EVERY input reaches the script through `env:`, never through `${{ }}` interpolation.
      # Actions substitutes `${{ }}` into the script text BEFORE bash parses it, so any backtick
      # in an input becomes command substitution and any `$(...)` executes. That is not theoretical
      # here: it silently ate two words from a real issue comment (`Sandwich` and `verify-phase-3`
      # were run as commands and replaced with empty strings). Once the repository is public,
      # issue-shaped text is untrusted input and this is a security boundary, not formatting.
      env:
        GH_TOKEN: ${{ inputs.token }}
        IN_STAGE: ${{ inputs.stage }}
        IN_WEEK: ${{ inputs.week }}
        IN_MODE: ${{ inputs.mode }}
        IN_TITLE: ${{ inputs.title }}
        IN_BODY: ${{ inputs.body }}
        IN_KIND: ${{ inputs.kind }}
        IN_COOLDOWN: ${{ inputs.cooldown-minutes }}
      run: |
        set -euo pipefail
        STAGE="$IN_STAGE"
        WEEK="$IN_WEEK"
        KIND="${IN_KIND:-failure}"
        RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

        # `kind` separates event classes that must never share a dedupe bucket. A freeze-integrity
        # FAILURE and an SP+ ARRIVAL are both stage:freeze, and when they collided the arrival —
        # the most important signal this pipeline emits — was appended as a comment to an issue
        # titled "pipeline: freeze failed", where its own title override could never apply.
        LABELS=("pipeline-${KIND}" "stage:${STAGE}")
        [ -n "$WEEK" ] && LABELS+=("week:${WEEK}")
        [ "$IN_MODE" = "rehearsal" ] && LABELS+=(rehearsal)

        for L in "${LABELS[@]}"; do
          gh label create "$L" --color B60205 --description "cfb pipeline" >/dev/null 2>&1 || true
        done

        TITLE="$IN_TITLE"
        [ -z "$TITLE" ] && TITLE="pipeline: ${STAGE} ${KIND}${WEEK:+ — 2026 week ${WEEK}}"

        TAIL="$(tail -n 120 "${RUNNER_TEMP}/pipeline.log" 2>/dev/null || echo '(no log captured)')"
        BODY="$(printf '%s\n\n**Run:** %s\n**Ref:** `%s` (%s)\n\n<details><summary>last 120 log lines</summary>\n\n```\n%s\n```\n\n</details>\n' \
                 "$IN_BODY" "$RUN_URL" "$GITHUB_REF_NAME" "$IN_MODE" "$TAIL")"

        # Dedupe by LABEL, never by `--search "in:title"`: the issue search index is eventually
        # consistent and lags by seconds to minutes — exactly the window in which back-to-back
        # failures need to find each other. Label filtering is a direct query.
        ARGS=(--state open --json number,updatedAt --limit 1)
        for L in "${LABELS[@]}"; do ARGS+=(--label "$L"); done
        EXISTING="$(gh issue list "${ARGS[@]}" --jq '.[0].number // empty')"

        if [ -z "$EXISTING" ]; then
          LABEL_CSV="$(IFS=,; echo "${LABELS[*]}")"
          gh issue create --title "$TITLE" --body "$BODY" --label "$LABEL_CSV" \
            --assignee "${GITHUB_REPOSITORY_OWNER}" 2>/dev/null \
            || gh issue create --title "$TITLE" --body "$BODY" --label "$LABEL_CSV"
          echo "::notice::opened a new pipeline-failure issue"
          exit 0
        fi

        # An open issue exists. Comment only outside the cooldown — this caps COMMENTS as well as
        # issues, which the naive "one issue" design forgets: a job failing every 20 minutes over a
        # weekend would otherwise leave 100 comments.
        #
        # BUT the cooldown assumes a repeat is the SAME failure. It is not always: the capture job
        # failed on missing secrets, then two hours later on a rejected push — a completely
        # different diagnosis, silently suppressed because it shared a stage and a week. So the
        # body carries a signature of the failing line, and a CHANGED signature bypasses the
        # cooldown. Repetition is throttled; a new failure mode is never silenced.
        SIG="$(grep -aoE '(::error::|fatal:|Error:|ABORT:)[^\r\n]{0,120}' \
                 "${RUNNER_TEMP}/pipeline.log" 2>/dev/null | tail -1 \
                 | cksum | awk '{print $1}')"
        SIG="${SIG:-nosig}"
        BODY="$(printf '%s\n<!-- failure-signature: %s -->\n' "$BODY" "$SIG")"

        LAST="$(gh issue view "$EXISTING" --json comments \
                 --jq '(.comments | last | .createdAt) // ""')"
        LAST_BODY="$(gh issue view "$EXISTING" --json comments \
                 --jq '(.comments | last | .body) // ""')"
        if [ -n "$LAST" ] && printf '%s' "$LAST_BODY" | grep -q "failure-signature: ${SIG}"; then
          AGE=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s 2>/dev/null || echo 0) ) / 60 ))
          if [ "$AGE" -lt "$IN_COOLDOWN" ]; then
            echo "::notice::issue #${EXISTING} has the SAME failure signature and was commented ${AGE}m ago (< cooldown) — not commenting again"
            exit 0
          fi
        elif [ -n "$LAST" ]; then
          echo "::notice::failure signature CHANGED — commenting despite the cooldown"
        fi
        gh issue comment "$EXISTING" --body "$BODY"
        echo "::notice::commented on existing issue #${EXISTING}"
