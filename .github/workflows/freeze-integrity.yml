# Daily freeze integrity + the external-data-event probe.
#
# Two of these three checks also run in CI, and that is deliberate: CI answers "did THIS COMMIT
# move model output", which only fires when someone pushes. This job answers "is the freeze still
# intact, and has the world changed underneath it" on a clock, during the quiet weeks when nobody
# is pushing at all.
#
# sp_watch is the reason the scheduled run is worth having. The fingerprint reads a committed
# snapshot, so re-running it on a timer detects nothing external by construction.
name: Freeze integrity (daily)

on:
  schedule:
    - cron: "43 11 * * *"   # 07:43 ET — no other job occupies that slot
  workflow_dispatch:

concurrency:
  group: freeze-integrity
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install

      # Path-level freeze proof, in milliseconds, immune to a whitespace-preserving edit.
      # Deliberately the SAME assertion the cadence jobs run, invoked through the same script
      # rather than reimplemented here — a second copy of a guard is how two guards drift apart,
      # and a drifted guard is worse than none because it reads as covered (D25.4).
      - name: Freeze + provenance preflight
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python scripts/pipeline_preflight.py --role freeze 2>&1 | tee -a "$RUNNER_TEMP/pipeline.log"
          exit "${PIPESTATUS[0]}"

      # `cmd | tee f` exits with TEE's status, which is always 0 — so under `bash -e` a failing
      # `cmd` leaves the step green. This step had no `exit "${PIPESTATUS[0]}"` and swallowed a real
      # `[FAIL]` on 2026-09-02 and 2026-09-03: the fingerprint gate reported a mismatch, the log
      # said `1 CHECK(S) FAILED`, and the job reported success both days. The freeze's own alarm was
      # the one check in this workflow that could not ring.
      - name: Behavioural fingerprint
        run: |
          make verify-phase-3 2>&1 | tee -a "$RUNNER_TEMP/pipeline.log"
          exit "${PIPESTATUS[0]}"

      # 2 CFBD calls, ZERO Odds credits. Exit 2 = the data arrived.
      - name: SP+ / returning-production watch
        id: spwatch
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          set +e
          python scripts/sp_watch.py 2>&1 | tee -a "$RUNNER_TEMP/pipeline.log"
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Fail on a probe error
        if: steps.spwatch.outputs.rc != '0' && steps.spwatch.outputs.rc != '2'
        run: |
          echo "::error::sp_watch exited ${{ steps.spwatch.outputs.rc }}"
          exit 1

      # An arrival opens an Issue and leaves the job GREEN. The correct response is the SPEC §3
      # exception process plus a new tag — a decision, not a revert — and a red check would only
      # pressure someone into making that change quietly.
      - name: SP+ has arrived — open an Issue
        if: steps.spwatch.outputs.rc == '2'
        uses: ./.github/actions/report-failure
        with:
          stage: freeze
          # `kind: transition` gives this its own label and dedupe bucket. Sharing
          # `pipeline-failure` meant an open "the freeze job failed" issue swallowed the arrival
          # as a comment, under a title that read as a broken job — and the title override below
          # could never apply, because it only applies when an issue is CREATED.
          kind: transition
          title: "CFBD has published 2026 SP+ / returning production — SPEC §3 exception needed"
          body: >
            The frozen model's inputs have changed. D10 activates SP+ and the returning-production
            prior with no code change, so `Sandwich` wakes up and preseason ratings start moving.
            Model output will move and `verify-phase-3` will fail CORRECTLY on the next snapshot
            rebuild. That needs a dated SPEC §3 exception entry and a NEW tag — never a constant
            update. Re-measure the slate and record the delta before the graded dress rehearsal.
          mode: live
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/report-failure
        if: failure()
        with:
          stage: freeze
          kind: failure
          mode: live
          token: ${{ secrets.GITHUB_TOKEN }}

      # This workflow had no close path at all, unlike the three cadence workflows — so a
      # freeze-integrity failure stayed open forever once fixed. It clears only `kind: failure`:
      # an SP+ arrival is not "recovered" by a later green run, because the data is still there.
      # That issue is closed deliberately, by the retag that resolves it.
      - uses: ./.github/actions/clear-failure
        if: success()
        with:
          stage: freeze
          kind: failure
          mode: live
          token: ${{ secrets.GITHUB_TOKEN }}
