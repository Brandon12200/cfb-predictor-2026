# Daily freeze integrity + the external-data-event probe.
#
# Two of these three checks also run in CI, and that is deliberate: CI answers "did THIS COMMIT
# move model output", which only fires when someone pushes. This job answers "is the freeze still
# intact, and has the world changed underneath it" on a clock, during the quiet weeks when nobody
# is pushing at all.
#
# sp_watch is the reason the scheduled run is worth having. The fingerprint reads a committed
# snapshot, so re-running it on a timer detects nothing external by construction.
name: Freeze integrity (daily)

on:
  # SEASON STOP (D48). The `schedule:` block is deleted — see `weekly-predict.yml` for the full
  # reasoning. The cadence it ran is retained in `season.json` `pipeline.schedule_et` as the record;
  # `workflow_dispatch` stays so the job remains runnable by hand.
  workflow_dispatch:

concurrency:
  group: freeze-integrity
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install

      # Path-level freeze proof, in milliseconds, immune to a whitespace-preserving edit.
      # Deliberately the SAME assertion the cadence jobs run, invoked through the same script
      # rather than reimplemented here — a second copy of a guard is how two guards drift apart,
      # and a drifted guard is worse than none because it reads as covered (D25.4).
      - name: Freeze + provenance preflight
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python scripts/pipeline_preflight.py --role freeze 2>&1 | tee -a "$RUNNER_TEMP/pipeline.log"
          exit "${PIPESTATUS[0]}"

      # `cmd | tee f` exits with TEE's status, which is always 0 — so under `bash -e` a failing
      # `cmd` leaves the step green. This step had no `exit "${PIPESTATUS[0]}"` and swallowed a real
      # `[FAIL]` on 2026-09-02 and 2026-09-03: the fingerprint gate reported a mismatch, the log
      # said `1 CHECK(S) FAILED`, and the job reported success both days. The freeze's own alarm was
      # the one check in this workflow that could not ring.
      - name: Behavioural fingerprint
        run: |
          make verify-phase-3 2>&1 | tee -a "$RUNNER_TEMP/pipeline.log"
          exit "${PIPESTATUS[0]}"

      # 2 CFBD calls, ZERO Odds credits. Exit 2 = the data arrived.
      - name: SP+ / returning-production watch
        id: spwatch
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          set +e
          python scripts/sp_watch.py 2>&1 | tee -a "$RUNNER_TEMP/pipeline.log"
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # A probe error reddens the job — an unobservable upstream is worth knowing about — but it is
      # NOT a freeze failure, and D48 separates the two. `rc != ''` is explicit: a skipped step
      # leaves the output empty, and an empty string is not an error code (D46's lesson).
      - name: Fail on a probe error
        if: steps.spwatch.outputs.rc != '' && steps.spwatch.outputs.rc != '0' && steps.spwatch.outputs.rc != '2'
        run: |
          echo "::error::sp_watch exited ${{ steps.spwatch.outputs.rc }}"
          exit 1

      # An arrival opens an Issue and leaves the job GREEN. The correct response is the SPEC §3
      # exception process plus a new tag — a decision, not a revert — and a red check would only
      # pressure someone into making that change quietly.
      - name: SP+ has arrived — open an Issue
        if: steps.spwatch.outputs.rc == '2'
        uses: ./.github/actions/report-failure
        with:
          stage: freeze
          # `kind: transition` gives this its own label and dedupe bucket. Sharing
          # `pipeline-failure` meant an open "the freeze job failed" issue swallowed the arrival
          # as a comment, under a title that read as a broken job — and the title override below
          # could never apply, because it only applies when an issue is CREATED.
          kind: transition
          title: "CFBD has published 2026 SP+ / returning production — SPEC §3 exception needed"
          body: >
            The frozen model's inputs have changed. D10 activates SP+ and the returning-production
            prior with no code change, so `Sandwich` wakes up and preseason ratings start moving.
            Model output will move and `verify-phase-3` will fail CORRECTLY on the next snapshot
            rebuild. That needs a dated SPEC §3 exception entry and a NEW tag — never a constant
            update. Re-measure the slate and record the delta before the graded dress rehearsal.
          mode: live
          token: ${{ secrets.GITHUB_TOKEN }}

      # D44 claim tripwire, detection only (owner ruling 2026-09-15). It was written for one cause:
      # the cadence workflows share a concurrency group, and under the queue default a newer pending
      # run cancelled the older, silently, because a cancelled run never fires `if: failure()` — so a
      # Tuesday predict could vanish with the week's claim. **D46 set `queue: max` on that group, so
      # that cause is gone** and this check now stands for the others: GitHub drops scheduled runs
      # under load, a predict can fail outright, and a claim can land `-dirty`. From Wednesday to
      # Saturday it checks the current week's claim exists and is not `-dirty`. It lives here because this job has its own group, which no
      # cadence run can cancel. It runs LAST so a tripwire error can never skip the freeze checks above,
      # and `!cancelled()` keeps a failed freeze check from also hiding a missing claim.
      # Default branch only. This job has no live/rehearsal mode resolution (unlike `cfb-setup`) and
      # hardcodes `mode: live`, so a dispatch on a rehearsal branch would judge that branch's tree and
      # file a LIVE "no claim for the week" alarm — the one alarm that must not be forgeable from a
      # drill (review of the D44 PR, finding 4).
      - name: Claim tripwire
        id: tripwire
        if: ${{ !cancelled() && github.ref_name == github.event.repository.default_branch }}
        run: |
          set +e
          python scripts/claim_tripwire.py 2>&1 | tee -a "$RUNNER_TEMP/pipeline.log"
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Fail on a tripwire error
        if: ${{ !cancelled() && steps.tripwire.outputs.rc != '' && steps.tripwire.outputs.rc != '0' && steps.tripwire.outputs.rc != '2' && steps.tripwire.outputs.rc != '3' }}
        run: |
          echo "::error::claim_tripwire exited ${{ steps.tripwire.outputs.rc }}"
          exit 1

      # A tripped wire leaves this job GREEN and opens an issue for the week. The two outcomes get
      # different kinds, because only one of them is fixable:
      #   rc 2, the claim is MISSING — re-dispatching predict writes it, and that run's
      #         `clear-failure` (kind `failure`) closes this issue. Recovery is real.
      #   rc 3, the claim is DIRTY — a claim is byte-immutable (D22), so nothing can replace it. A
      #         re-dispatched predict SKIPS the claim and succeeds, which under kind `failure` would
      #         have closed the issue while nothing was fixed, and the next morning's tripwire would
      #         reopen it: a daily flap around a permanent fact. `dirty-claim` is never cleared by
      #         `clear-failure`; it stays open for the owner.
      - name: Claim missing — open a predict Issue
        if: ${{ !cancelled() && steps.tripwire.outputs.rc == '2' }}
        uses: ./.github/actions/report-failure
        with:
          stage: predict
          kind: failure
          week: ${{ steps.tripwire.outputs.week_padded }}
          title: "pipeline: no claim — 2026 week ${{ steps.tripwire.outputs.week_padded }}"
          body: "Claim tripwire (D44): ${{ steps.tripwire.outputs.reason }}. Re-dispatch weekly-predict for this week before its first kickoff; a successful run writes the claim and closes this issue."
          mode: live
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Claim is dirty — open a permanent Issue
        if: ${{ !cancelled() && steps.tripwire.outputs.rc == '3' }}
        uses: ./.github/actions/report-failure
        with:
          stage: predict
          kind: dirty-claim
          week: ${{ steps.tripwire.outputs.week_padded }}
          title: "pipeline: claim is -dirty — 2026 week ${{ steps.tripwire.outputs.week_padded }}"
          body: "Claim tripwire (D44): ${{ steps.tripwire.outputs.reason }}. This CANNOT be repaired by re-running anything: the claim is byte-immutable (D22), so a re-dispatched predict skips it and succeeds. The week's pre-registration carries this stamp permanently — an owner decision, not a recovery."
          mode: live
          token: ${{ secrets.GITHUB_TOKEN }}

      # D48 item 2: a probe error gets its OWN kind, label, dedupe bucket and title.
      #
      # The defect this fixes, demonstrated 2026-10-21/22: `sp_watch` hit a CFBD Cloudflare 502,
      # this job went red, and the only reporter was the generic one below — so the owner was
      # emailed "pipeline: freeze failure" about a run in which **every freeze check passed and the
      # fingerprint matched**. Worse than the wrong title: the issue carried
      # `pipeline-failure` + `stage:freeze`, the same dedupe bucket a real freeze failure uses, so
      # the next morning's rerun closed #73 as "recovered" — a probe outage silently clearing the
      # alarm that means the frozen model moved.
      #
      # The pattern is not new: the SP+ ARRIVAL path above already has its own `kind: transition`
      # and title for exactly this reason. This is that ruling applied one step further.
      - uses: ./.github/actions/report-failure
        if: failure() && steps.spwatch.outputs.rc != '' && steps.spwatch.outputs.rc != '0' && steps.spwatch.outputs.rc != '2'
        with:
          stage: freeze
          kind: probe
          title: "CFBD probe unreachable — sp_watch could not observe SP+/returning production"
          body: >
            `scripts/sp_watch.py` could not reach CFBD, so this run could not observe whether SP+ or
            returning production moved. **The freeze itself is not implicated**: every freeze check
            in this run is reported above, and a probe outage says nothing about the frozen model.
            Three such outages failed scheduled runs this season (#56, #71, #72), which is why the
            CFBD client now retries once on a transport error or a 5xx (D48) — reaching this issue
            means both attempts failed. Re-dispatch this workflow once CFBD is reachable; a
            successful run closes this automatically.
          mode: live
          token: ${{ secrets.GITHUB_TOKEN }}

      # Everything else: a failed freeze check, a bad fingerprint, a tripwire error. Gated to
      # exclude the probe case so one red run never files two issues, and so this title keeps
      # meaning what it says.
      - uses: ./.github/actions/report-failure
        if: failure() && (steps.spwatch.outputs.rc == '' || steps.spwatch.outputs.rc == '0' || steps.spwatch.outputs.rc == '2')
        with:
          stage: freeze
          kind: failure
          mode: live
          token: ${{ secrets.GITHUB_TOKEN }}

      # This workflow had no close path at all, unlike the three cadence workflows — so a
      # freeze-integrity failure stayed open forever once fixed. It clears only `kind: failure`:
      # an SP+ arrival is not "recovered" by a later green run, because the data is still there.
      # That issue is closed deliberately, by the retag that resolves it.
      # Default branch only, for the mirror of the reason above: a green dispatch on a rehearsal
      # branch must not close a live freeze-integrity issue (review of the D44 PR, finding 4).
      - uses: ./.github/actions/clear-failure
        if: success() && github.ref_name == github.event.repository.default_branch
        with:
          stage: freeze
          kind: failure
          mode: live
          token: ${{ secrets.GITHUB_TOKEN }}

      # Symmetric clear for the new kind (D48). Without it a `pipeline-probe` issue would stay open
      # after CFBD came back and the label would stop meaning "a live problem" — the same reasoning
      # that put a clear path on this workflow in the first place. Separate kinds must mean separate
      # clears: that is the whole point of not sharing a bucket.
      - uses: ./.github/actions/clear-failure
        if: success() && github.ref_name == github.event.repository.default_branch
        with:
          stage: freeze
          kind: probe
          mode: live
          token: ${{ secrets.GITHUB_TOKEN }}
