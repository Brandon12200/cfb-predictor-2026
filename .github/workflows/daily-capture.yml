# Wed–Sat line capture (PHASE5_NOTES §1: daily, NOT Saturday-only) plus intra-Saturday waves.
#
# Each game's close is the last observation before THAT game's own kickoff (per-game as-of-T,
# `closing_observation`), so the schedule's job is simply to have a recent observation standing
# before each kickoff window. One Saturday-morning fetch would leave a 22:30 ET kickoff with a
# 12-hour-stale "close", and closing_observation would faithfully report it — CLV noise for the
# largest part of the slate. The four Saturday waves are a ratified refinement of the daily
# cadence, not a replacement for it (D-7).
name: Daily line capture (Wed–Sat)

on:
  schedule:
    - cron: "23 21 * * 3,4,5"  # Wed/Thu/Fri 17:23 ET — ~1h37m before a 19:00 ET kickoff
    - cron: "23 14 * * 6"      # Sat 10:23 ET — before the 12:00 wave
    - cron: "23 18 * * 6"      # Sat 14:23 ET — before the 15:30 wave
    - cron: "23 21 * * 6"      # Sat 17:23 ET — before the 19:00 wave
    - cron: "23  0 * * 0"      # Sat 20:23 ET — before the 22:30 wave. SUNDAY in UTC; this line is
                               # why week resolution must use ET (see utils.season_calendar).
  workflow_dispatch:
    inputs:
      week:
        required: false
        type: string
      year:
        required: false
        type: string
        default: "2026"
      dry_run:
        required: false
        type: boolean
        default: false
      min_credits:
        description: "Override the Odds floor; set very high to drill the budget-refusal path"
        required: false
        type: string
        default: ""

concurrency:
  group: cfb-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Deploy key, NOT the default GITHUB_TOKEN. The `main-protection` ruleset's
          # required-status-checks rule blocks DIRECT PUSHES, not just merges: a brand-new commit
          # has no check results, so every push is refused ("9 of 9 required status checks are
          # expected"). Observed live on 2026-08-08 — the run did everything right and was refused
          # at the last step. "Deploy keys" is on the ruleset's bypass list, so pushes made with
          # this key are not evaluated against that rule.
          #
          # Consequence, deliberate: deploy-key pushes DO trigger workflows (GITHUB_TOKEN pushes do
          # not), so every data commit now runs CI on main. That is why this change also regenerates
          # the derived exports — without them `verify-phase-2` would go red on the first snapshot
          # of a new week.
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - id: setup
        uses: ./.github/actions/cfb-setup
        with:
          role: capture
          week: ${{ inputs.week }}
          year: ${{ inputs.year || '2026' }}
          skip-secrets: ${{ inputs.dry_run == true }}
          odds-api-key: ${{ secrets.ODDS_API_KEY }}

      # Cross-run memory for the pre-spend guard is now the committed append-only ledger
      # (data/quota/, SPEC §10.5) — it survives a fresh checkout by being in the repo, which the
      # actions/cache workaround could not guarantee: an evicted cache left the guard blind and
      # falling back to a week-stale snapshot figure.
      - name: Capture line observation
        id: capture
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set +e
          ARGS=(--week "${{ steps.setup.outputs.week }}" --year "${{ steps.setup.outputs.year }}")
          if [ -n "${{ inputs.min_credits }}" ]; then ARGS+=(--min-credits "${{ inputs.min_credits }}"); fi
          python scripts/fetch_lines.py "${ARGS[@]}" 2>&1 | tee -a "$RUNNER_TEMP/pipeline.log"
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # Exit 3 is the budget refusal: a designed outcome, not a failure. The job stays green,
      # commits nothing, and says so. Any other non-zero is a real failure.
      - name: Budget refusal (not a failure)
        if: steps.capture.outputs.rc == '3'
        run: |
          echo "### Odds budget refusal" >> "$GITHUB_STEP_SUMMARY"
          echo "The pre-spend guard declined this capture; no credit was spent and nothing was committed." >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Odds budget guard refused the fetch — see the step summary."

      - name: Fail on a real error
        if: steps.capture.outputs.rc != '0' && steps.capture.outputs.rc != '3'
        run: |
          echo "::error::fetch_lines exited ${{ steps.capture.outputs.rc }}"
          exit 1

      - uses: ./.github/actions/cfb-commit
        if: steps.capture.outputs.rc == '0'
        with:
          paths: data/lines data/quota
          message: "lines: ${{ steps.setup.outputs.year }} week ${{ steps.setup.outputs.week_padded }} observation ${{ steps.setup.outputs.et_now }}"
          suffix: ${{ steps.setup.outputs.commit_suffix }}
          push: ${{ inputs.dry_run != true }}

      - uses: ./.github/actions/report-failure
        # A dry run must not open a real issue. `dry_run` previously gated only `skip-secrets`
        # and `push`, so a failing dry run filed an issue labelled exactly like a live failure —
        # observed: #38, from a smoke.
        if: failure() && inputs.dry_run != true
        with:
          stage: capture
          week: ${{ steps.setup.outputs.week_padded }}
          mode: ${{ steps.setup.outputs.mode }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/clear-failure
        # ...and must not CLOSE one either. This is the worse half: a PASSING dry run would have
        # cleared a real, unresolved failure issue. Only run ordering avoided it when the live
        # capture proof ran before any dry smoke — sequencing is not a control.
        if: success() && inputs.dry_run != true
        with:
          stage: capture
          week: ${{ steps.setup.outputs.week_padded }}
          mode: ${{ steps.setup.outputs.mode }}
          token: ${{ secrets.GITHUB_TOKEN }}
