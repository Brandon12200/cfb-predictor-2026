# Tue–Sat line capture (PHASE5_NOTES §1: daily, NOT Saturday-only), two slots per kickoff window.
#
# Each game's close is the last observation before THAT game's own kickoff (per-game as-of-T,
# `closing_observation`), so the schedule's job is simply to have a recent observation standing
# before each kickoff window.
#
# D44 (from week 4). Actions scheduled runs fired 97–485 min late through week 3, so each run landed
# after the window its slot was meant to precede, and Saturday's noon games took a 16.7 h-stale close.
# Each window now has two slots, recorded with `precedes` and `kind` in season.json:
# * a GUARANTEE slot at window − 6 h 10 min. 5 h 10 min cleared the worst observed lateness
#   (309 min) by one minute on n=12, which is not margin; 6 h 10 min clears it by 61 (I1.1);
# * a BEST-EFFORT slot at window − 2 h 35 min on Saturday, timed to the median lateness, so it
#   usually lands shortly before kickoff. The Wed–Fri 17:23 slot is best-effort with a 97-min lead,
#   which every measured weekday sample exceeds; it serves the 19:30+ kickoffs, not the 19:00 window.
# The Tuesday slot exists because Tuesday games start in week 6, and without a capture their only
# close would be the claim's own snapshot observation.
name: Daily line capture (Tue–Sat)

on:
  schedule:
    - cron: "50 16 * * 2"      # Tue 12:50 ET — guarantee, before 19:00
    # One line per weekday, never `3,4,5`: the timing guard finds the slot that fired by matching
    # `github.event.schedule` and walking back to that cron's latest time. With a shared line, a
    # Wednesday run more than 24 h late would match THURSDAY's slot and report on-time (D44 audit).
    - cron: "50 16 * * 3"      # Wed 12:50 ET — guarantee, before 19:00
    - cron: "23 21 * * 3"      # Wed 17:23 ET — best-effort, before 19:00 (serves 19:30+ kickoffs)
    - cron: "50 16 * * 4"      # Thu 12:50 ET — guarantee, before 19:00
    - cron: "23 21 * * 4"      # Thu 17:23 ET — best-effort, before 19:00
    - cron: "50 16 * * 5"      # Fri 12:50 ET — guarantee, before 19:00
    - cron: "23 21 * * 5"      # Fri 17:23 ET — best-effort, before 19:00
    - cron: "50 9 * * 6"       # Sat 05:50 ET — guarantee, before 12:00
    - cron: "25 13 * * 6"      # Sat 09:25 ET — best-effort, before 12:00
    - cron: "20 13 * * 6"      # Sat 09:20 ET — guarantee, before 15:30
    - cron: "55 16 * * 6"      # Sat 12:55 ET — best-effort, before 15:30
    - cron: "50 16 * * 6"      # Sat 12:50 ET — guarantee, before 19:00
    - cron: "25 20 * * 6"      # Sat 16:25 ET — best-effort, before 19:00
    - cron: "20 20 * * 6"      # Sat 16:20 ET — guarantee, before 22:30
    - cron: "55 23 * * 6"      # Sat 19:55 ET — best-effort, before 22:30. Still Saturday in UTC under
                               # EDT; week resolution uses ET regardless (utils.season_calendar).
  workflow_dispatch:
    inputs:
      week:
        required: false
        type: string
      year:
        required: false
        type: string
        default: "2026"
      dry_run:
        required: false
        type: boolean
        default: false
      min_credits:
        description: "Override the Odds floor; set very high to drill the budget-refusal path"
        required: false
        type: string
        default: ""

concurrency:
  group: cfb-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Deploy key, NOT the default GITHUB_TOKEN. The `main-protection` ruleset's
          # required-status-checks rule blocks DIRECT PUSHES, not just merges: a brand-new commit
          # has no check results, so every push is refused ("9 of 9 required status checks are
          # expected"). Observed live on 2026-08-08 — the run did everything right and was refused
          # at the last step. "Deploy keys" is on the ruleset's bypass list, so pushes made with
          # this key are not evaluated against that rule.
          #
          # Consequence, deliberate: deploy-key pushes DO trigger workflows (GITHUB_TOKEN pushes do
          # not), so every data commit now runs CI on main. That is why this change also regenerates
          # the derived exports — without them `verify-phase-2` would go red on the first snapshot
          # of a new week.
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - id: setup
        uses: ./.github/actions/cfb-setup
        with:
          role: capture
          week: ${{ inputs.week }}
          year: ${{ inputs.year || '2026' }}
          skip-secrets: ${{ inputs.dry_run == true }}
          odds-api-key: ${{ secrets.ODDS_API_KEY }}

      # Cross-run memory for the pre-spend guard is now the committed append-only ledger
      # (data/quota/, SPEC §10.5) — it survives a fresh checkout by being in the repo, which the
      # actions/cache workaround could not guarantee: an evicted cache left the guard blind and
      # falling back to a week-stale snapshot figure.
      - name: Capture line observation
        id: capture
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # The slot that fired this run: fetch_lines' exit 4 applies only to the Tuesday slot.
          CFB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set +e
          ARGS=(--week "${{ steps.setup.outputs.week }}" --year "${{ steps.setup.outputs.year }}")
          if [ -n "${{ inputs.min_credits }}" ]; then ARGS+=(--min-credits "${{ inputs.min_credits }}"); fi
          python scripts/fetch_lines.py "${ARGS[@]}" 2>&1 | tee -a "$RUNNER_TEMP/pipeline.log"
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # Exit 3 is the budget refusal: a designed outcome, not a failure. The job stays green,
      # commits nothing, and says so. Any other non-zero is a real failure.
      - name: Budget refusal (not a failure)
        if: steps.capture.outputs.rc == '3'
        run: |
          echo "### Odds budget refusal" >> "$GITHUB_STEP_SUMMARY"
          echo "The pre-spend guard declined this capture; no credit was spent and nothing was committed." >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Odds budget guard refused the fetch — see the step summary."

      # Exit 4: a scheduled Tuesday capture ran before the predict job built this week's snapshot.
      # A designed state by owner ruling (2026-09-15, D44): nothing was fetched and no credit spent,
      # and a predict that actually failed files its own issue. fetch_lines only returns 4 for the
      # scheduled Tuesday capture slot; any other missing snapshot is still exit 1.
      - name: Snapshot not built yet (not a failure)
        if: steps.capture.outputs.rc == '4'
        run: |
          echo "### Capture skipped: snapshot not built yet" >> "$GITHUB_STEP_SUMMARY"
          echo "This Tuesday capture ran before the predict job built week ${{ steps.setup.outputs.week_padded }}'s snapshot. Nothing was fetched or committed." >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Tuesday capture ran before the week's snapshot existed — designed state, nothing committed."

      - name: Fail on a real error
        if: steps.capture.outputs.rc != '0' && steps.capture.outputs.rc != '3' && steps.capture.outputs.rc != '4'
        run: |
          echo "::error::fetch_lines exited ${{ steps.capture.outputs.rc }}"
          exit 1

      - uses: ./.github/actions/cfb-commit
        if: steps.capture.outputs.rc == '0'
        with:
          paths: data/lines data/quota
          message: "lines: ${{ steps.setup.outputs.year }} week ${{ steps.setup.outputs.week_padded }} observation ${{ steps.setup.outputs.et_now }}"
          suffix: ${{ steps.setup.outputs.commit_suffix }}
          push: ${{ inputs.dry_run != true }}

      # D44 escalation, tier 2 (open). The preflight judged this run against the slot that fired it
      # (tiers 0-1). A GUARANTEE slot that landed at or after its window opens, or comments on, one
      # `pipeline-late` issue per week; the Sunday grade closes it with the tally. Cooldown 0, because
      # every guarantee miss is a distinct event the tally counts. The run stays green: WARN-not-ABORT.
      - uses: ./.github/actions/report-failure
        if: steps.setup.outputs.timing_guarantee_miss == 'true' && inputs.dry_run != true
        with:
          stage: capture
          week: ${{ steps.setup.outputs.week_padded }}
          mode: ${{ steps.setup.outputs.mode }}
          kind: late
          title: "pipeline: late capture — 2026 week ${{ steps.setup.outputs.week_padded }}"
          # `capture rc` is in the body because both things can be true at once: the slot missed its
          # window AND nothing was captured because the snapshot did not exist yet (exit 4). An issue
          # that reported only the first would be two true statements adding up to a wrong diagnosis
          # (review of the D44 PR, finding 18).
          body: "<!-- late-miss --> A guarantee capture slot missed its kickoff window (D44). ${{ steps.setup.outputs.timing_detail }} — capture exit code: ${{ steps.capture.outputs.rc }} (0 = an observation was recorded; 3 = budget refusal; 4 = the Tuesday snapshot did not exist yet, so nothing was captured for a reason unrelated to this slot's timing)."
          cooldown-minutes: "0"
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/report-failure
        # A dry run must not open a real issue. `dry_run` previously gated only `skip-secrets`
        # and `push`, so a failing dry run filed an issue labelled exactly like a live failure —
        # observed: #38, from a smoke.
        if: failure() && inputs.dry_run != true
        with:
          stage: capture
          week: ${{ steps.setup.outputs.week_padded }}
          mode: ${{ steps.setup.outputs.mode }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/clear-failure
        # ...and must not CLOSE one either. This is the worse half: a PASSING dry run would have
        # cleared a real, unresolved failure issue. Only run ordering avoided it when the live
        # capture proof ran before any dry smoke — sequencing is not a control.
        #
        # Gated on rc == '0', not success(): exit 3 (budget refusal) and exit 4 (a Tuesday capture
        # before the snapshot) are designed states that leave the job green having captured NOTHING,
        # and a run that did no work must not report a real capture failure as recovered (review of
        # the D44 PR, finding 6).
        if: steps.capture.outputs.rc == '0' && inputs.dry_run != true
        with:
          stage: capture
          week: ${{ steps.setup.outputs.week_padded }}
          mode: ${{ steps.setup.outputs.mode }}
          token: ${{ secrets.GITHUB_TOKEN }}
