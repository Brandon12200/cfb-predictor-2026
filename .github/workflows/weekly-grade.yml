# Sunday — finals, grading, reports. Three commits, one per artifact tier, in dependency order.
#
# A rendering never rides with an outcome (D23): `git log -- reports/` stays readable as a
# regeneration history, which is a rendering's entire audit trail.
#
# A partially-graded Sunday is a designed state, not a failure — grade.py is idempotent and the
# Tuesday catch-up finishes the week.
name: Weekly grade (Sun)

on:
  schedule:
    # 12:47 ET (16:47 UTC under EDT). The last Saturday 22:30 ET kickoff ends ~02:00 ET and CFBD
    # finals settle within an hour or two, leaving ~11h of slack.
    - cron: "47 16 * * 0"
  workflow_dispatch:
    inputs:
      week:
        required: false
        type: string
      year:
        required: false
        type: string
        default: "2026"
      dry_run:
        required: false
        type: boolean
        default: false

concurrency:
  group: cfb-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: setup
        uses: ./.github/actions/cfb-setup
        with:
          role: grade
          week: ${{ inputs.week }}
          year: ${{ inputs.year || '2026' }}
          skip-secrets: ${{ inputs.dry_run == true }}

      - name: Fetch finals
        id: results
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          set +e
          python scripts/fetch_results.py --week "${{ steps.setup.outputs.week }}" \
            --year "${{ steps.setup.outputs.year }}" 2>&1 | tee -a "$RUNNER_TEMP/pipeline.log"
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: No completed games yet (not a failure)
        if: steps.results.outputs.rc == '3'
        run: echo "::notice::no games have finished for this week yet — nothing to grade."

      - name: Fail on a real error
        if: steps.results.outputs.rc != '0' && steps.results.outputs.rc != '3'
        run: |
          echo "::error::fetch_results exited ${{ steps.results.outputs.rc }}"
          exit 1

      - uses: ./.github/actions/cfb-commit
        if: steps.results.outputs.rc == '0'
        with:
          paths: data/results
          message: "results: ${{ steps.setup.outputs.year }} week ${{ steps.setup.outputs.week_padded }} finals"
          suffix: ${{ steps.setup.outputs.commit_suffix }}
          push: ${{ inputs.dry_run != true }}

      - name: Grade
        if: steps.results.outputs.rc == '0'
        run: |
          python scripts/grade.py --week "${{ steps.setup.outputs.week }}" \
            --year "${{ steps.setup.outputs.year }}" 2>&1 | tee -a "$RUNNER_TEMP/pipeline.log"
          exit "${PIPESTATUS[0]}"

      - uses: ./.github/actions/cfb-commit
        if: steps.results.outputs.rc == '0'
        with:
          paths: data/graded
          message: "grading: ${{ steps.setup.outputs.year }} week ${{ steps.setup.outputs.week_padded }}"
          suffix: ${{ steps.setup.outputs.commit_suffix }}
          push: ${{ inputs.dry_run != true }}

      - name: Regenerate reports
        if: steps.results.outputs.rc == '0'
        run: |
          python scripts/build_reports.py --week "${{ steps.setup.outputs.week }}" \
            --year "${{ steps.setup.outputs.year }}" 2>&1 | tee -a "$RUNNER_TEMP/pipeline.log"
          python scripts/build_reports.py --season \
            --year "${{ steps.setup.outputs.year }}" 2>&1 | tee -a "$RUNNER_TEMP/pipeline.log"

      # ---------------------------------------------------------------------------------------
      # D36 GATE. The reports are generated above (so a rehearsal can inspect them), but they are
      # NOT committed until analytics/ carries D27's lean-side split and the naive
      # always-lean-home baseline. Preseason leans run 195 home / 35 away — 5.57:1, structural,
      # because TravelBurden/ConsecutiveRoad only penalise the visitor and Altitude only advantages
      # the host. An unsplit season headline over that skew is D17's exact failure, and publishing
      # it automatically every Sunday would be worse than publishing nothing.
      #
      # Remove this gate in the PR that lands the split. Hard deadline: the first graded Sunday.
      # ---------------------------------------------------------------------------------------
      - name: Report commit gate (D36)
        id: report_gate
        if: steps.results.outputs.rc == '0'
        run: |
          if grep -q "edge_direction" analytics/attribution.py; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::reports generated but NOT committed — analytics/attribution.py has no lean-side split yet (D27); an unsplit headline over a 5.57:1 home skew repeats D17."
            {
              echo "### Reports withheld (D36 gate)"
              echo "Generated but not committed: \`analytics/attribution.py\` has no lean-side"
              echo "stratification, so the season headline would be an unsplit blend over a"
              echo "5.57:1 structural home skew (D27). Land the split to open this gate."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: ./.github/actions/cfb-commit
        if: steps.results.outputs.rc == '0' && steps.report_gate.outputs.ready == 'true'
        with:
          paths: reports
          message: "report: ${{ steps.setup.outputs.year }} week ${{ steps.setup.outputs.week_padded }} + season to date"
          suffix: ${{ steps.setup.outputs.commit_suffix }}
          push: ${{ inputs.dry_run != true }}

      - uses: ./.github/actions/report-failure
        if: failure()
        with:
          stage: grade
          week: ${{ steps.setup.outputs.week_padded }}
          mode: ${{ steps.setup.outputs.mode }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/clear-failure
        if: success()
        with:
          stage: grade
          week: ${{ steps.setup.outputs.week_padded }}
          mode: ${{ steps.setup.outputs.mode }}
          token: ${{ secrets.GITHUB_TOKEN }}
