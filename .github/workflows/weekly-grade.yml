# Sunday — finals, grading, reports. Three commits, one per artifact tier, in dependency order.
#
# A rendering never rides with an outcome (D23): `git log -- reports/` stays readable as a
# regeneration history, which is a rendering's entire audit trail.
#
# A partially-graded Sunday is a designed state, not a failure — grade.py is idempotent and the
# Tuesday catch-up finishes the week.
name: Weekly grade (Sun)

on:
  schedule:
    # 12:47 ET (16:47 UTC under EDT). The last Saturday 22:30 ET kickoff ends ~02:00 ET and CFBD
    # finals settle within an hour or two, leaving ~11h of slack.
    - cron: "47 16 * * 0"
  workflow_dispatch:
    inputs:
      week:
        required: false
        type: string
      year:
        required: false
        type: string
        default: "2026"
      dry_run:
        required: false
        type: boolean
        default: false

concurrency:
  group: cfb-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Deploy key, NOT the default GITHUB_TOKEN. The `main-protection` ruleset's
          # required-status-checks rule blocks DIRECT PUSHES, not just merges: a brand-new commit
          # has no check results, so every push is refused ("9 of 9 required status checks are
          # expected"). Observed live on 2026-08-08 — the run did everything right and was refused
          # at the last step. "Deploy keys" is on the ruleset's bypass list, so pushes made with
          # this key are not evaluated against that rule.
          #
          # Consequence, deliberate: deploy-key pushes DO trigger workflows (GITHUB_TOKEN pushes do
          # not), so every data commit now runs CI on main. That is why this change also regenerates
          # the derived exports — without them `verify-phase-2` would go red on the first snapshot
          # of a new week.
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - id: setup
        uses: ./.github/actions/cfb-setup
        with:
          role: grade
          week: ${{ inputs.week }}
          year: ${{ inputs.year || '2026' }}
          skip-secrets: ${{ inputs.dry_run == true }}
          cfbd-api-key: ${{ secrets.CFBD_API_KEY }}

      - name: Fetch finals
        id: results
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          set +e
          python scripts/fetch_results.py --week "${{ steps.setup.outputs.week }}" \
            --year "${{ steps.setup.outputs.year }}" 2>&1 | tee -a "$RUNNER_TEMP/pipeline.log"
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Nothing to grade yet (not a failure)
        if: steps.results.outputs.rc == '3' || steps.results.outputs.rc == '4'
        run: |
          if [ "${{ steps.results.outputs.rc }}" = "4" ]; then
            echo "::notice::no claim for this week yet — the predict run writes it. Normal preseason state."
          else
            echo "::notice::no games have finished for this week yet — nothing to grade."
          fi

      # 3 = no completed games yet, 4 = no claim yet. Both are designed states of a working
      # pipeline; only anything else is a failure. Treating 4 as an error opened a real issue
      # (#36) every preseason Sunday.
      - name: Fail on a real error
        if: steps.results.outputs.rc != '0' && steps.results.outputs.rc != '3' && steps.results.outputs.rc != '4'
        run: |
          echo "::error::fetch_results exited ${{ steps.results.outputs.rc }}"
          exit 1

      - uses: ./.github/actions/cfb-commit
        if: steps.results.outputs.rc == '0'
        with:
          paths: data/results
          message: "results: ${{ steps.setup.outputs.year }} week ${{ steps.setup.outputs.week_padded }} finals"
          suffix: ${{ steps.setup.outputs.commit_suffix }}
          push: ${{ inputs.dry_run != true }}

      - name: Grade
        if: steps.results.outputs.rc == '0'
        run: |
          python scripts/grade.py --week "${{ steps.setup.outputs.week }}" \
            --year "${{ steps.setup.outputs.year }}" 2>&1 | tee -a "$RUNNER_TEMP/pipeline.log"
          exit "${PIPESTATUS[0]}"

      # Owner ruling 2026-09-13: the CLV sign check moves INTO the pipeline, here, before the grades
      # are committed. It was a human step run against the Sunday report — but this job commits the
      # grades about thirty seconds after producing them, so a disagreement was always going to be
      # on `main` before anyone could look, and `data/graded/` is append-only. Two independent
      # checks per graded lean (formula, and the sign implied by which way the line moved) — see
      # `scripts/check_clv.py`. A failure here fails the run, skips the commit below, and files the
      # pipeline-failure issue.
      - name: Validate CLV signs before committing grades
        if: steps.results.outputs.rc == '0'
        run: |
          python scripts/check_clv.py --week "${{ steps.setup.outputs.week }}" \
            --year "${{ steps.setup.outputs.year }}" 2>&1 | tee -a "$RUNNER_TEMP/pipeline.log"
          exit "${PIPESTATUS[0]}"

      - uses: ./.github/actions/cfb-commit
        if: steps.results.outputs.rc == '0'
        with:
          paths: data/graded
          message: "grading: ${{ steps.setup.outputs.year }} week ${{ steps.setup.outputs.week_padded }}"
          suffix: ${{ steps.setup.outputs.commit_suffix }}
          push: ${{ inputs.dry_run != true }}

      # `set -euo pipefail` rather than a trailing `exit "${PIPESTATUS[0]}"`: there are TWO commands
      # here, and an `exit` after the first would skip the season report entirely. Without it both
      # `| tee` pipelines returned tee's status and a renderer crash left this step green — the
      # commit below is gated only on `results.outputs.rc`, so a failed render would have been
      # committed as whatever was on disk. Same masking class as the fingerprint step; found by
      # sweeping every `| tee` in every workflow rather than only fixing the one that fired.
      # Renders EVERY gradable week, not just `pipeline_week`. Grading and rendering happen in
      # different jobs: the Tuesday predict job's catch-up loop grades earlier weeks (that is how
      # week 1 closed at 11/11 on 2026-09-08), and nothing re-rendered them, so
      # `reports/2026_week_01.md` sat at "8/11 games graded" while its graded file said otherwise.
      # A report is a pure function of (claim, graded), so re-rendering a week that did not change
      # is a no-op: identical bytes, `git diff --cached --quiet` in cfb-commit, nothing committed.
      # That makes this self-healing — any week whose rendering has fallen behind its data is
      # corrected on the next Sunday that grades anything — rather than a fix that has to be
      # remembered. `grade_weeks` comes from `cfb-setup` via `gradable_weeks()`: every week with a
      # claim on disk, which is exactly the set that can have a graded file to fall behind.
      #
      # GRADE_WEEKS goes through `env:` as hygiene, not because it is untrusted: `pipeline_week.py`
      # builds it from `gradable_weeks()`, so it is digits and single spaces and nothing else. That
      # is a weaker case than ci.yml's `HEAD_REF`, which uses `env:` because a fork controls the
      # value. Note `--year` below is still inline `${{ }}` — this step is not claiming a blanket
      # no-interpolation rule, only routing the one value that is iterated as a list.
      # The expansion is deliberately unquoted — it is a space-separated list and word-splitting
      # is the point; an empty value simply iterates zero times.
      - name: Regenerate reports
        if: steps.results.outputs.rc == '0'
        env:
          GRADE_WEEKS: ${{ steps.setup.outputs.grade_weeks }}
        run: |
          set -euo pipefail
          for W in $GRADE_WEEKS; do
            python scripts/build_reports.py --week "$W" \
              --year "${{ steps.setup.outputs.year }}" 2>&1 | tee -a "$RUNNER_TEMP/pipeline.log"
          done
          python scripts/build_reports.py --season \
            --year "${{ steps.setup.outputs.year }}" 2>&1 | tee -a "$RUNNER_TEMP/pipeline.log"

      # The commit message names the report files this run actually changed. Since #58 the step
      # above renders every gradable week, but the message still named only `pipeline_week`, so
      # `535d2b9` was titled "week 02" while also rewriting week 01. See
      # `scripts/changed_report_weeks.py`.
      #
      # Two lines, deliberately: `echo "label=$(cmd)"` would take echo's exit status and swallow a
      # failing script — the same masking class as an unguarded `| tee`. A bare assignment carries
      # the command substitution's status, so `bash -e` stops on it.
      - name: Name the reports that changed
        id: reportweeks
        if: steps.results.outputs.rc == '0'
        run: |
          label=$(python scripts/changed_report_weeks.py --year "${{ steps.setup.outputs.year }}")
          echo "label=$label" >> "$GITHUB_OUTPUT"

      # The D36 gate that withheld this commit is REMOVED: `analytics/attribution.py` now carries
      # D27's lean-side split and the naive always-lean-home baseline, and the report leads with
      # them rather than with a blended headline. The gate existed so an unsplit season number
      # over a 5.57:1 structural home skew could never be published automatically; that risk is
      # closed at the source instead of held back at the commit.
      - uses: ./.github/actions/cfb-commit
        if: steps.results.outputs.rc == '0'
        with:
          paths: reports
          message: "report: ${{ steps.setup.outputs.year }} ${{ steps.reportweeks.outputs.label }}"
          suffix: ${{ steps.setup.outputs.commit_suffix }}
          push: ${{ inputs.dry_run != true }}

      # D44 escalation, tier 2 (close). Each GUARANTEE capture slot that missed its window opened or
      # commented on one `pipeline-late` issue for its week (daily-capture.yml). By Sunday that week's
      # captures are over, so the grade closes the issue with its tally. It sweeps EVERY open one, not
      # only this week's: a Saturday slot late enough to land after Sunday's grade, or a grade that
      # failed, would otherwise leave an issue no later Sunday ever targets (D44 audit). A best-effort
      # miss never reaches the issue (owner ruling 2026-09-15).
      - name: Close the week's late-capture issue with its tally
        if: success() && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_WEEK: ${{ steps.setup.outputs.week_padded }}
          IN_MODE: ${{ steps.setup.outputs.mode }}
        run: |
          set -euo pipefail
          ARGS=(--state open --json number --limit 50 --label pipeline-late --label stage:capture)
          [ "$IN_MODE" = "rehearsal" ] && ARGS+=(--label rehearsal)
          for N in $(gh issue list "${ARGS[@]}" --jq '.[].number'); do
            WEEK="$(gh issue view "$N" --json labels \
                     --jq '[.labels[].name | select(startswith("week:"))][0] // "week:?" | ltrimstr("week:")')"
            MISSES="$(gh issue view "$N" --json body,comments \
                       --jq '[.body, .comments[].body] | map(select(test("late-miss"))) | length')"
            gh issue comment "$N" --body "Week ${WEEK} captures are complete: ${MISSES} guarantee slot(s) missed their window. Closed by the week ${IN_WEEK} Sunday grade (D44 tier 2)."
            gh issue close "$N"
            echo "::notice::closed late-capture issue #${N} (${MISSES} guarantee miss(es))"
          done

      - uses: ./.github/actions/report-failure
        # A dry run must not open a real issue. `dry_run` previously gated only `skip-secrets`
        # and `push`, so a failing dry run filed an issue labelled exactly like a live failure —
        # observed: #38, from a smoke.
        if: failure() && inputs.dry_run != true
        with:
          stage: grade
          week: ${{ steps.setup.outputs.week_padded }}
          mode: ${{ steps.setup.outputs.mode }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/clear-failure
        # ...and must not CLOSE one either. This is the worse half: a PASSING dry run would have
        # cleared a real, unresolved failure issue. Only run ordering avoided it when the live
        # capture proof ran before any dry smoke — sequencing is not a control.
        if: success() && inputs.dry_run != true
        with:
          stage: grade
          week: ${{ steps.setup.outputs.week_padded }}
          mode: ${{ steps.setup.outputs.mode }}
          token: ${{ secrets.GITHUB_TOKEN }}
